name: Senior skills validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Validate matrix coverage and document links
        run: python scripts/validate.py
      - name: Check fail-closed intake behavior
        run: python -m unittest discover -s tests -v
      - name: Enforce competitor-driven visual review proof
        run: |
          if python3 scripts/visual_quality_gate.py --input examples/lock-in-visual-review-draft.json --evidence-root . --out /tmp/lock-in-visual-check.json; then
            echo "ERROR: planning draft with unchecked fonts and illustration assets must not pass"
            exit 1
          fi
          python3 -c "import json; r=json.load(open('/tmp/lock-in-visual-check.json')); s={v['code'] for v in r['findings']}; assert r['status']=='BLOCKED_UNVERIFIED_DESIGN' and 'UNVERIFIED_ASSET_LICENSE' in s"
      - name: Demo is unpriced and private-only
        run: |
          python scripts/portfolio_intake.py assess --input examples/zero-budget-demo.intake.json --output /tmp/private-assessment.json
          python -c "import json; d=json.load(open('/tmp/private-assessment.json')); assert d['status']=='READY_FOR_PLANNING' and d['estimate']['monthly_quoted_subtotal'] is None and d['release_authorized'] is False"
      - name: Public GitHub discovery smoke (verified refs; no clone)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/github_reference_research.py --query "event registration management" --limit 2 --out /tmp/public-reference-report.json --live
          python -c "import json; x=json.load(open('/tmp/public-reference-report.json')); assert len(x['candidates'])>=1; assert all(v['reuse_status'] in ('STUDY_ONLY','LICENSE_REVIEW_REQUIRED') for v in x['candidates'])"
