name: Senior skills validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Validate matrix coverage and document links
        run: python scripts/validate.py
      - name: Check fail-closed intake behavior
        run: python -m unittest discover -s tests -v
      - name: Demo is unpriced and private-only
        run: |
          python scripts/portfolio_intake.py assess --input examples/zero-budget-demo.intake.json --output /tmp/private-assessment.json
          python -c "import json; d=json.load(open('/tmp/private-assessment.json')); assert d['status']=='READY_FOR_PLANNING' and d['estimate']['monthly_quoted_subtotal'] is None and d['release_authorized'] is False"
